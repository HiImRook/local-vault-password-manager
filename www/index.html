  <script>

const cryptoModule = (function() {
const SALT_LENGTH = 16
const IV_LENGTH = 12
const KEY_LENGTH = 256
const MASTER_KEY_LENGTH = 32
const PBKDF2_ITERATIONS = 600000
const LEGACY_PBKDF2_ITERATIONS = 100000

async function generateSalt() {
  return crypto.getRandomValues(new Uint8Array(SALT_LENGTH))
}

async function generateIV() {
  return crypto.getRandomValues(new Uint8Array(IV_LENGTH))
}

async function generateMasterKey() {
  return crypto.getRandomValues(new Uint8Array(MASTER_KEY_LENGTH))
}

async function deriveKeyFromSecret(secret, salt, iterations = PBKDF2_ITERATIONS) {
  const encoder = new TextEncoder()
  const keyMaterial = await crypto.subtle.importKey(
    'raw',
    typeof secret === 'string' ? encoder.encode(secret) : secret,
    'PBKDF2',
    false,
    ['deriveKey']
  )

  return crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: salt,
      iterations: iterations,
      hash: 'SHA-256'
    },
    keyMaterial,
    { name: 'AES-GCM', length: KEY_LENGTH },
    false,
    ['wrapKey', 'unwrapKey', 'encrypt', 'decrypt']
  )
}

async function deriveKeyFromPrfOutput(prfOutput, info) {
  const encoder = new TextEncoder()
  const keyMaterial = await crypto.subtle.importKey(
    'raw',
    prfOutput instanceof Uint8Array ? prfOutput : new Uint8Array(prfOutput),
    'HKDF',
    false,
    ['deriveKey']
  )

  return crypto.subtle.deriveKey(
    {
      name: 'HKDF',
      hash: 'SHA-256',
      salt: new Uint8Array(0),
      info: encoder.encode(info)
    },
    keyMaterial,
    { name: 'AES-GCM', length: KEY_LENGTH },
    false,
    ['wrapKey', 'unwrapKey', 'encrypt', 'decrypt']
  )
}

async function masterKeyToCryptoKey(masterKeyBytes) {
  return crypto.subtle.importKey(
    'raw',
    masterKeyBytes,
    { name: 'AES-GCM', length: KEY_LENGTH },
    true,
    ['encrypt', 'decrypt']
  )
}

async function wrapMasterKey(masterKeyBytes, wrappingKey) {
  const iv = await generateIV()
  const masterKey = await crypto.subtle.importKey(
    'raw',
    masterKeyBytes,
    { name: 'AES-GCM', length: KEY_LENGTH },
    true,
    ['encrypt', 'decrypt']
  )

  const wrapped = await crypto.subtle.wrapKey(
    'raw',
    masterKey,
    wrappingKey,
    { name: 'AES-GCM', iv: iv }
  )

  return {
    iv: Array.from(iv),
    wrapped: Array.from(new Uint8Array(wrapped))
  }
}

async function unwrapMasterKey(wrappedData, unwrappingKey) {
  const iv = new Uint8Array(wrappedData.iv)
  const wrapped = new Uint8Array(wrappedData.wrapped)

  const masterKey = await crypto.subtle.unwrapKey(
    'raw',
    wrapped,
    unwrappingKey,
    { name: 'AES-GCM', iv: iv },
    { name: 'AES-GCM', length: KEY_LENGTH },
    true,
    ['encrypt', 'decrypt']
  )

  return masterKey
}

async function encrypt(plaintext, key) {
  const encoder = new TextEncoder()
  const iv = await generateIV()
  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv: iv },
    key,
    encoder.encode(plaintext)
  )

  return {
    iv: Array.from(iv),
    ciphertext: Array.from(new Uint8Array(ciphertext))
  }
}

async function decrypt(encrypted, key) {
  const decoder = new TextDecoder()
  const iv = new Uint8Array(encrypted.iv)
  const ciphertext = new Uint8Array(encrypted.ciphertext)

  const plaintext = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: iv },
    key,
    ciphertext
  )

  return decoder.decode(plaintext)
}

async function createBackupSignature(payload, key) {
  const encoder = new TextEncoder()
  const keyBytes = await crypto.subtle.exportKey('raw', key)

  const hmacKey = await crypto.subtle.importKey(
    'raw',
    keyBytes,
    { name: 'HMAC', hash: 'SHA-256' },
    false,
    ['sign']
  )

  const signature = await crypto.subtle.sign('HMAC', hmacKey, encoder.encode(payload))
  return Array.from(new Uint8Array(signature))
}

async function verifyBackupSignature(payload, signature, key) {
  const encoder = new TextEncoder()
  const keyBytes = await crypto.subtle.exportKey('raw', key)

  const hmacKey = await crypto.subtle.importKey(
    'raw',
    keyBytes,
    { name: 'HMAC', hash: 'SHA-256' },
    false,
    ['verify']
  )

  return crypto.subtle.verify('HMAC', hmacKey, new Uint8Array(signature), encoder.encode(payload))
}
return {
  PBKDF2_ITERATIONS,
  LEGACY_PBKDF2_ITERATIONS,
  generateSalt,
  generateIV,
  generateMasterKey,
  deriveKeyFromSecret,
  deriveKeyFromPrfOutput,
  masterKeyToCryptoKey,
  wrapMasterKey,
  unwrapMasterKey,
  encrypt,
  decrypt,
  createBackupSignature,
  verifyBackupSignature
}
})();

const storeModule = (function() {
const DB_NAME = 'ValidVault'
const DB_VERSION = 1

let db = null

async function openDB() {
  if (db) return db
  
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION)
    
    request.onerror = () => reject(request.error)
    
    request.onsuccess = () => {
      db = request.result
      resolve(db)
    }
    
    request.onupgradeneeded = (event) => {
      const database = event.target.result
      
      if (!database.objectStoreNames.contains('auth')) {
        database.createObjectStore('auth', { keyPath: 'id' })
      }
      
      if (!database.objectStoreNames.contains('passwords')) {
        database.createObjectStore('passwords', { keyPath: 'id' })
      }
      
      if (!database.objectStoreNames.contains('wallets')) {
        database.createObjectStore('wallets', { keyPath: 'id' })
      }
    }
  })
}

async function getStore(storeName, mode) {
  const database = await openDB()
  const tx = database.transaction(storeName, mode)
  return tx.objectStore(storeName)
}

async function get(storeName, key) {
  const store = await getStore(storeName, 'readonly')
  return new Promise((resolve, reject) => {
    const request = store.get(key)
    request.onerror = () => reject(request.error)
    request.onsuccess = () => resolve(request.result || null)
  })
}

async function put(storeName, data) {
  const store = await getStore(storeName, 'readwrite')
  return new Promise((resolve, reject) => {
    const request = store.put(data)
    request.onerror = () => reject(request.error)
    request.onsuccess = () => resolve(request.result)
  })
}

async function remove(storeName, key) {
  const store = await getStore(storeName, 'readwrite')
  return new Promise((resolve, reject) => {
    const request = store.delete(key)
    request.onerror = () => reject(request.error)
    request.onsuccess = () => resolve()
  })
}

async function getAuth() {
  return get('auth', 'primary')
}

async function setAuth(authData) {
  return put('auth', { id: 'primary', ...authData })
}

async function getPasswordVault() {
  return get('passwords', 'vault')
}

async function setPasswordVault(vaultData) {
  return put('passwords', { id: 'vault', ...vaultData })
}

async function getWalletVault() {
  return get('wallets', 'vault')
}

async function setWalletVault(vaultData) {
  return put('wallets', { id: 'vault', ...vaultData })
}

async function clearAll() {
  const database = await openDB()
  const stores = ['auth', 'passwords', 'wallets']

  await Promise.all(stores.map(storeName => new Promise((resolve, reject) => {
    const tx = database.transaction(storeName, 'readwrite')
    tx.objectStore(storeName).clear()
    tx.oncomplete = () => resolve()
    tx.onerror = () => reject(tx.error)
  })))
}
return {
  openDB,
  get,
  put,
  remove,
  getAuth,
  setAuth,
  getPasswordVault,
  setPasswordVault,
  getWalletVault,
  setWalletVault,
  clearAll
}
})();

const sessionModule = (function() {
const {
  generateSalt,
  deriveKeyFromSecret,
  masterKeyToCryptoKey,
  encrypt,
  decrypt
} = cryptoModule
const session = {
  masterKey: null,
  softLock: null,
  resumeAttempts: 0,
  unlockedDomains: new Set(),
  lastActivity: 0,
  timeoutId: null
}

const SESSION_TIMEOUT = 300000
const MAX_RESUME_ATTEMPTS = 3

function setMasterKey(key) {
  session.masterKey = key
  session.lastActivity = Date.now()
  startTimeout()
}

function getMasterKey() {
  return session.masterKey
}

function hasMasterKey() {
  return session.masterKey !== null
}

async function setSessionPin(pin) {
  if (!session.masterKey) {
    return { success: false, error: 'Unlock vault first' }
  }

  if (pin.length < 4 || pin.length > 6 || !/^\d+$/.test(pin)) {
    return { success: false, error: 'PIN must be 4-6 digits' }
  }

  const salt = await generateSalt()
  const wrappingKey = await deriveKeyFromSecret(pin, salt)
  const masterKeyBytes = new Uint8Array(await crypto.subtle.exportKey('raw', session.masterKey))
  const encryptedKey = await encrypt(JSON.stringify(Array.from(masterKeyBytes)), wrappingKey)

  session.softLock = { encryptedKey, salt }
  session.resumeAttempts = 0
  return { success: true }
}

function clearSessionPin() {
  session.softLock = null
  session.resumeAttempts = 0
}

function hasSessionPin() {
  return session.softLock !== null
}

function isSoftLocked() {
  return session.masterKey === null && session.softLock !== null
}

function softLockNow() {
  if (!session.softLock) return false
  session.masterKey = null
  session.unlockedDomains.clear()
  stopTimeout()
  return true
}

async function resumeWithPin(pin) {
  if (!session.softLock) {
    return { success: false, error: 'No session to resume' }
  }

  if (session.masterKey) {
    return { success: false, error: 'Session already unlocked' }
  }

  try {
    const unwrappingKey = await deriveKeyFromSecret(pin, session.softLock.salt)
    const decrypted = await decrypt(session.softLock.encryptedKey, unwrappingKey)
    const masterKeyBytes = new Uint8Array(JSON.parse(decrypted))
    const masterKey = await masterKeyToCryptoKey(masterKeyBytes)

    session.resumeAttempts = 0
    setMasterKey(masterKey)
    return { success: true, masterKey }
  } catch (error) {
    session.resumeAttempts++
    if (session.resumeAttempts >= MAX_RESUME_ATTEMPTS) {
      lockAll()
      return { success: false, error: 'Too many attempts. Vault locked. Unlock with password or fingerprint.' }
    }
    return { success: false, error: `Invalid PIN. ${MAX_RESUME_ATTEMPTS - session.resumeAttempts} attempts remaining` }
  }
}

function unlockDomain(domain) {
  session.unlockedDomains.add(domain)
}

function lockDomain(domain) {
  session.unlockedDomains.delete(domain)
}

function isDomainUnlocked(domain) {
  return session.unlockedDomains.has(domain)
}

function getUnlockedDomains() {
  return Array.from(session.unlockedDomains)
}

function resetActivity() {
  session.lastActivity = Date.now()
}

function checkTimeout() {
  if (!session.masterKey) return false

  const elapsed = Date.now() - session.lastActivity
  if (elapsed >= SESSION_TIMEOUT) {
    if (session.softLock) {
      softLockNow()
    } else {
      lockAll()
    }
    return true
  }

  return false
}

function startTimeout() {
  stopTimeout()
  session.timeoutId = setInterval(() => {
    if (checkTimeout()) {
      console.log('Session locked due to inactivity')
    }
  }, 10000)
}

function stopTimeout() {
  if (session.timeoutId) {
    clearInterval(session.timeoutId)
    session.timeoutId = null
  }
}

function lockAll() {
  session.masterKey = null
  session.softLock = null
  session.resumeAttempts = 0
  session.unlockedDomains.clear()
  session.lastActivity = 0
  stopTimeout()
}

function getState() {
  return {
    hasMasterKey: hasMasterKey(),
    hasSessionPin: hasSessionPin(),
    isSoftLocked: isSoftLocked(),
    unlockedDomains: getUnlockedDomains(),
    lastActivity: session.lastActivity
  }
}
return {
  setMasterKey,
  getMasterKey,
  hasMasterKey,
  setSessionPin,
  clearSessionPin,
  hasSessionPin,
  isSoftLocked,
  softLockNow,
  resumeWithPin,
  unlockDomain,
  lockDomain,
  isDomainUnlocked,
  getUnlockedDomains,
  resetActivity,
  checkTimeout,
  lockAll,
  getState
}
})();

const passwordsModule = (function() {
const { encrypt, decrypt } = cryptoModule
const { getPasswordVault, setPasswordVault } = storeModule
function generateId() {
  return crypto.randomUUID()
}

async function ensureVault() {
  const existing = await getPasswordVault()
  if (existing) return { success: true }

  const vault = {
    meta: {
      version: 1,
      createdAt: Date.now(),
      lastAccess: Date.now()
    },
    credentials: {}
  }

  await setPasswordVault(vault)
  return { success: true }
}

function isLive(cred) {
  return !cred.deleted
}

async function saveCredential(domain, username, password, masterKey) {
  await ensureVault()
  const vault = await getPasswordVault()

  const encUsername = await encrypt(username, masterKey)
  const encPassword = await encrypt(password, masterKey)

  if (!vault.credentials[domain]) {
    vault.credentials[domain] = []
  }

  const existing = []
  for (const cred of vault.credentials[domain]) {
    if (cred.deleted) {
      existing.push(cred)
      continue
    }
    const existingUsername = await decrypt(cred.username, masterKey)
    if (existingUsername === username) continue
    existing.push(cred)
  }

  const id = generateId()
  existing.push({
    id,
    username: encUsername,
    password: encPassword,
    createdAt: Date.now(),
    updatedAt: Date.now()
  })

  vault.credentials[domain] = existing
  vault.meta.lastAccess = Date.now()

  await setPasswordVault(vault)
  return { success: true, id }
}

async function getCredentials(domain, masterKey) {
  await ensureVault()
  const vault = await getPasswordVault()

  const domainCreds = vault.credentials[domain]
  if (!domainCreds || domainCreds.length === 0) {
    return { success: true, credentials: [] }
  }

  const decrypted = []
  for (const cred of domainCreds) {
    if (cred.deleted) continue
    try {
      decrypted.push({
        id: cred.id,
        username: await decrypt(cred.username, masterKey),
        password: await decrypt(cred.password, masterKey),
        createdAt: cred.createdAt,
        updatedAt: cred.updatedAt
      })
    } catch (error) {
      return { success: false, error: 'Decryption failed' }
    }
  }

  return { success: true, credentials: decrypted }
}

async function getAllDomains() {
  await ensureVault()
  const vault = await getPasswordVault()

  const domains = []
  for (const domain of Object.keys(vault.credentials)) {
    const hasLive = vault.credentials[domain].some(isLive)
    if (hasLive) domains.push(domain)
  }

  return { success: true, domains }
}

async function updateCredential(credentialId, updates, masterKey) {
  const vault = await getPasswordVault()
  if (!vault) return { success: false, error: 'No vault' }

  for (const domain of Object.keys(vault.credentials)) {
    const creds = vault.credentials[domain]
    function matchesId(candidate) {
      return candidate.id === credentialId
    }
    const index = creds.findIndex(matchesId)

    if (index !== -1) {
      if (creds[index].deleted) return { success: false, error: 'Credential deleted' }
      if (updates.username) {
        creds[index].username = await encrypt(updates.username, masterKey)
      }
      if (updates.password) {
        creds[index].password = await encrypt(updates.password, masterKey)
      }
      creds[index].updatedAt = Date.now()
      vault.meta.lastAccess = Date.now()

      await setPasswordVault(vault)
      return { success: true }
    }
  }

  return { success: false, error: 'Credential not found' }
}

async function deleteCredential(credentialId) {
  const vault = await getPasswordVault()
  if (!vault) return { success: false, error: 'No vault' }

  for (const domain of Object.keys(vault.credentials)) {
    const creds = vault.credentials[domain]
    function matchesId(candidate) {
      return candidate.id === credentialId
    }
    const index = creds.findIndex(matchesId)

    if (index !== -1) {
      creds[index] = {
        id: creds[index].id,
        deleted: true,
        deletedAt: Date.now(),
        updatedAt: Date.now()
      }

      vault.meta.lastAccess = Date.now()
      await setPasswordVault(vault)
      return { success: true }
    }
  }

  return { success: false, error: 'Credential not found' }
}

async function autofill(domain, credentialId, masterKey) {
  const result = await getCredentials(domain, masterKey)
  if (!result.success) return result

  if (result.credentials.length === 0) {
    return { success: false, error: 'No credentials for domain' }
  }

  if (credentialId) {
    function matchesAutofillId(candidate) {
      return candidate.id === credentialId
    }
    const cred = result.credentials.find(matchesAutofillId)
    if (cred) return { success: true, username: cred.username, password: cred.password }
    return { success: false, error: 'Credential not found' }
  }

  const cred = result.credentials[0]
  return { success: true, username: cred.username, password: cred.password }
}

async function reEncryptVault(vault, oldKey, newKey) {
  const out = {
    meta: { version: vault.meta.version, createdAt: vault.meta.createdAt, lastAccess: vault.meta.lastAccess },
    credentials: {}
  }

  for (const domain of Object.keys(vault.credentials)) {
    const list = []
    for (const cred of vault.credentials[domain]) {
      if (cred.deleted) {
        list.push(cred)
        continue
      }
      const username = await decrypt(cred.username, oldKey)
      const password = await decrypt(cred.password, oldKey)
      list.push({
        id: cred.id,
        username: await encrypt(username, newKey),
        password: await encrypt(password, newKey),
        createdAt: cred.createdAt,
        updatedAt: cred.updatedAt
      })
    }
    out.credentials[domain] = list
  }

  return out
}

async function mergeVaults(localVault, incomingVault, masterKey) {
  const merged = {
    meta: {
      version: localVault.meta.version,
      createdAt: Math.min(localVault.meta.createdAt, incomingVault.meta.createdAt),
      lastAccess: Date.now()
    },
    credentials: {}
  }

  const domains = new Set([
    ...Object.keys(localVault.credentials),
    ...Object.keys(incomingVault.credentials)
  ])

  for (const domain of domains) {
    const localCreds = localVault.credentials[domain] || []
    const incomingCreds = incomingVault.credentials[domain] || []

    const byUsername = new Map()

    async function keyFor(cred) {
      if (cred.deleted) return 'tomb:' + cred.id
      try {
        return 'user:' + (await decrypt(cred.username, masterKey))
      } catch (error) {
        return 'id:' + cred.id
      }
    }

    for (const cred of [...localCreds, ...incomingCreds]) {
      const key = await keyFor(cred)
      const existing = byUsername.get(key)
      if (!existing || cred.updatedAt > existing.updatedAt) {
        byUsername.set(key, cred)
      }
    }

    const tombstones = new Map()
    for (const cred of [...localCreds, ...incomingCreds]) {
      if (cred.deleted) {
        const prev = tombstones.get(cred.id)
        if (!prev || cred.updatedAt > prev.updatedAt) tombstones.set(cred.id, cred)
      }
    }

    const result = []
    for (const cred of byUsername.values()) {
      if (cred.deleted) continue
      const tomb = tombstones.get(cred.id)
      if (tomb && tomb.updatedAt > cred.updatedAt) continue
      result.push(cred)
    }

    if (result.length > 0) merged.credentials[domain] = result
  }

  return merged
}
return {
  ensureVault,
  saveCredential,
  getCredentials,
  getAllDomains,
  updateCredential,
  deleteCredential,
  autofill
}
})();

const authModule = (function() {
const {
  PBKDF2_ITERATIONS,
  LEGACY_PBKDF2_ITERATIONS,
  generateSalt,
  generateMasterKey,
  deriveKeyFromSecret,
  deriveKeyFromPrfOutput,
  masterKeyToCryptoKey,
  wrapMasterKey,
  unwrapMasterKey
} = cryptoModule
const { getAuth, setAuth } = storeModule
const RP_NAME = 'Local Vault'
const RP_ID = location.hostname
const PRF_INFO = 'valid-vault-prf-wrap-v2'
const LEGACY_FINGERPRINT_SECRET = 'valid-vault-fingerprint-auth-v1'

const attempts = new Map()
const LOCKOUT_MS = 60000
const MAX_ATTEMPTS = 3
const CREATION_TIMEOUT_MS = 60000

const creationTimers = new Map()

function checkRateLimit(type) {
  const record = attempts.get(type)
  if (!record) return { allowed: true }
  if (Date.now() - record.lastAttempt > LOCKOUT_MS) {
    attempts.delete(type)
    return { allowed: true }
  }
  if (record.count >= MAX_ATTEMPTS) {
    const remaining = Math.ceil((LOCKOUT_MS - (Date.now() - record.lastAttempt)) / 1000)
    return { allowed: false, remaining }
  }
  return { allowed: true }
}

function recordFailedAttempt(type) {
  const record = attempts.get(type) || { count: 0, lastAttempt: 0 }
  record.count++
  record.lastAttempt = Date.now()
  attempts.set(type, record)
}

function clearAttempts(type) {
  attempts.delete(type)
}

function startCreationTimer(type) {
  cancelCreationTimer(type)
  const timer = {
    startedAt: Date.now(),
    timeoutId: setTimeout(() => {
      creationTimers.delete(type)
    }, CREATION_TIMEOUT_MS)
  }
  creationTimers.set(type, timer)
  return timer.startedAt
}

function checkCreationTimer(type) {
  const timer = creationTimers.get(type)
  if (!timer) return { valid: false, error: 'Creation session expired' }
  if (Date.now() - timer.startedAt > CREATION_TIMEOUT_MS) {
    creationTimers.delete(type)
    return { valid: false, error: 'Creation session expired' }
  }
  return { valid: true, remaining: Math.ceil((CREATION_TIMEOUT_MS - (Date.now() - timer.startedAt)) / 1000) }
}

function cancelCreationTimer(type) {
  const timer = creationTimers.get(type)
  if (timer) {
    clearTimeout(timer.timeoutId)
    creationTimers.delete(type)
  }
}

function hasWrappedKeys(auth) {
  if (!auth) return false
  return !!(auth.fingerprintWrappedKey || auth.passwordWrappedKey || auth.pinWrappedKey)
}

async function purgeLegacyPin() {
  const auth = await getAuth()
  if (auth && (auth.pinWrappedKey || auth.pinSalt || auth.pinHash || auth.pinKdfIterations)) {
    delete auth.pinWrappedKey
    delete auth.pinSalt
    delete auth.pinHash
    delete auth.pinKdfIterations
    await setAuth(auth)
  }
}

async function migrateLegacyMasterKey() {
  const auth = await getAuth()
  if (auth && auth.masterKey) {
    delete auth.masterKey
    await setAuth(auth)
  }
}

async function resolveMasterKeyBytes(existingMasterKey, auth) {
  if (existingMasterKey) {
    const bytes = existingMasterKey instanceof CryptoKey
      ? new Uint8Array(await crypto.subtle.exportKey('raw', existingMasterKey))
      : new Uint8Array(existingMasterKey)
    return { bytes, isNewVault: false }
  }
  if (hasWrappedKeys(auth)) {
    return { error: true }
  }
  return { bytes: await generateMasterKey(), isNewVault: true }
}

async function upgradeWrap(auth, method, secret, masterKey) {
  const iterations = auth[method + 'KdfIterations'] || 0
  if (iterations >= PBKDF2_ITERATIONS && !auth[method + 'Hash']) return

  const salt = await generateSalt()
  const wrappingKey = await deriveKeyFromSecret(secret, salt)
  const masterKeyBytes = new Uint8Array(await crypto.subtle.exportKey('raw', masterKey))

  auth[method + 'WrappedKey'] = await wrapMasterKey(masterKeyBytes, wrappingKey)
  auth[method + 'Salt'] = Array.from(salt)
  auth[method + 'KdfIterations'] = PBKDF2_ITERATIONS
  delete auth[method + 'Hash']

  await setAuth(auth)
}

async function initAuth() {
  const auth = await getAuth()
  return {
    hasFingerprint: !!(auth && auth.fingerprintEnabled && auth.fingerprintWrappedKey),
    hasPassword: !!(auth && auth.passwordWrappedKey),
    hasLegacyPIN: !!(auth && auth.pinWrappedKey),
    hasVault: hasWrappedKeys(auth),
    isNew: !auth || !hasWrappedKeys(auth)
  }
}

async function evaluatePrf(credentialId, prfSalt) {
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rpId: RP_ID,
      allowCredentials: [{ id: credentialId, type: 'public-key' }],
      userVerification: 'required',
      extensions: { prf: { eval: { first: prfSalt } } },
      timeout: 60000
    }
  })

  const results = assertion.getClientExtensionResults()
  if (!results.prf || !results.prf.results || !results.prf.results.first) return null
  return new Uint8Array(results.prf.results.first)
}

function startFingerprintEnrollment() {
  return startCreationTimer('fingerprint')
}

async function enrollFingerprint(existingMasterKey) {
  const timerCheck = checkCreationTimer('fingerprint')
  if (!timerCheck.valid) {
    return { success: false, error: timerCheck.error }
  }

  try {
    const auth = await getAuth() || {}

    if (!existingMasterKey && hasWrappedKeys(auth)) {
      return { success: false, error: 'Vault exists. Unlock first to add fingerprint.' }
    }

    const prfSalt = crypto.getRandomValues(new Uint8Array(32))

    const credential = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: RP_NAME, id: RP_ID },
        user: {
          id: new TextEncoder().encode('valid-vault-user'),
          name: 'vault-user',
          displayName: 'Vault User'
        },
        pubKeyCredParams: [
          { alg: -7, type: 'public-key' },
          { alg: -257, type: 'public-key' }
        ],
        authenticatorSelection: {
          authenticatorAttachment: 'platform',
          userVerification: 'required',
          residentKey: 'preferred'
        },
        extensions: { prf: { eval: { first: prfSalt } } },
        timeout: 60000
      }
    })

    const created = credential.getClientExtensionResults()
    const prfAtCreate = created.prf && created.prf.results && created.prf.results.first
    const prfEnabled = created.prf && created.prf.enabled

    if (!prfAtCreate && !prfEnabled) {
      return { success: false, error: 'This device cannot bind keys to biometrics. Use PIN or password instead.' }
    }

    const credentialId = new Uint8Array(credential.rawId)

    const prfOutput = prfAtCreate
      ? new Uint8Array(created.prf.results.first)
      : await evaluatePrf(credentialId, prfSalt)

    if (!prfOutput) {
      return { success: false, error: 'PRF evaluation failed' }
    }

    const wrappingKey = await deriveKeyFromPrfOutput(prfOutput, PRF_INFO)

    const resolved = await resolveMasterKeyBytes(existingMasterKey, auth)
    if (resolved.error) {
      return { success: false, error: 'Vault exists. Unlock first to add fingerprint.' }
    }

    auth.fingerprintWrappedKey = await wrapMasterKey(resolved.bytes, wrappingKey)
    auth.fingerprintCredentialId = Array.from(credentialId)
    auth.fingerprintPrfSalt = Array.from(prfSalt)
    auth.fingerprintEnabled = true
    delete auth.fingerprintSalt

    await setAuth(auth)

    const masterKey = await masterKeyToCryptoKey(resolved.bytes)

    cancelCreationTimer('fingerprint')
    return { success: true, masterKey, isNewVault: resolved.isNewVault }
  } catch (error) {
    return { success: false, error: error.message }
  }
}

async function authenticateLegacyFingerprint(auth) {
  await navigator.credentials.get({
    publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rpId: RP_ID,
      userVerification: 'required',
      timeout: 60000
    }
  })

  const salt = new Uint8Array(auth.fingerprintSalt)
  const unwrappingKey = await deriveKeyFromSecret(LEGACY_FINGERPRINT_SECRET, salt, LEGACY_PBKDF2_ITERATIONS)
  const masterKey = await unwrapMasterKey(auth.fingerprintWrappedKey, unwrappingKey)

  delete auth.fingerprintEnabled
  delete auth.fingerprintWrappedKey
  delete auth.fingerprintSalt
  await setAuth(auth)

  await migrateLegacyMasterKey()

  clearAttempts('fingerprint')
  return { success: true, masterKey, requiresReenroll: true }
}

async function authenticateFingerprint() {
  const rateCheck = checkRateLimit('fingerprint')
  if (!rateCheck.allowed) {
    return { success: false, error: `Too many attempts. Wait ${rateCheck.remaining}s` }
  }

  try {
    const auth = await getAuth()
    if (!auth || !auth.fingerprintEnabled) {
      return { success: false, error: 'No fingerprint enrolled' }
    }

    if (!auth.fingerprintWrappedKey) {
      return { success: false, error: 'Fingerprint not configured properly' }
    }

    if (!auth.fingerprintCredentialId) {
      return await authenticateLegacyFingerprint(auth)
    }

    const credentialId = new Uint8Array(auth.fingerprintCredentialId)
    const prfSalt = new Uint8Array(auth.fingerprintPrfSalt)

    const prfOutput = await evaluatePrf(credentialId, prfSalt)
    if (!prfOutput) {
      recordFailedAttempt('fingerprint')
      return { success: false, error: 'PRF evaluation failed' }
    }

    const unwrappingKey = await deriveKeyFromPrfOutput(prfOutput, PRF_INFO)
    const masterKey = await unwrapMasterKey(auth.fingerprintWrappedKey, unwrappingKey)

    await purgeLegacyPin()
    await migrateLegacyMasterKey()

    clearAttempts('fingerprint')
    return { success: true, masterKey }
  } catch (error) {
    recordFailedAttempt('fingerprint')
    return { success: false, error: error.message }
  }
}

function startPasswordCreation() {
  return startCreationTimer('password')
}

async function setPassword(password, existingMasterKey) {
  const timerCheck = checkCreationTimer('password')
  if (!timerCheck.valid) {
    return { success: false, error: timerCheck.error }
  }

  if (password.length < 8) {
    return { success: false, error: 'Password must be at least 8 characters' }
  }

  const auth = await getAuth() || {}
  const resolved = await resolveMasterKeyBytes(existingMasterKey, auth)
  if (resolved.error) {
    return { success: false, error: 'Vault exists. Unlock first to add password.' }
  }

  const salt = await generateSalt()
  const wrappingKey = await deriveKeyFromSecret(password, salt)

  auth.passwordWrappedKey = await wrapMasterKey(resolved.bytes, wrappingKey)
  auth.passwordSalt = Array.from(salt)
  auth.passwordKdfIterations = PBKDF2_ITERATIONS
  delete auth.passwordHash

  await setAuth(auth)

  cancelCreationTimer('password')

  const masterKey = await masterKeyToCryptoKey(resolved.bytes)
  return { success: true, masterKey, isNewVault: resolved.isNewVault }
}

async function authenticatePassword(password) {
  const rateCheck = checkRateLimit('password')
  if (!rateCheck.allowed) {
    return { success: false, error: `Too many attempts. Wait ${rateCheck.remaining}s` }
  }

  const auth = await getAuth()
  if (!auth || !auth.passwordWrappedKey) {
    return { success: false, error: 'No password set' }
  }

  try {
    const salt = new Uint8Array(auth.passwordSalt)
    const iterations = auth.passwordKdfIterations || LEGACY_PBKDF2_ITERATIONS
    const unwrappingKey = await deriveKeyFromSecret(password, salt, iterations)
    const masterKey = await unwrapMasterKey(auth.passwordWrappedKey, unwrappingKey)

    await upgradeWrap(auth, 'password', password, masterKey)
    await purgeLegacyPin()
    await migrateLegacyMasterKey()

    clearAttempts('password')
    return { success: true, masterKey }
  } catch (error) {
    recordFailedAttempt('password')
    return { success: false, error: 'Invalid password' }
  }
}

async function authenticateLegacyPIN(pin) {
  const rateCheck = checkRateLimit('pin')
  if (!rateCheck.allowed) {
    return { success: false, error: `Too many attempts. Wait ${rateCheck.remaining}s` }
  }

  const auth = await getAuth()
  if (!auth || !auth.pinWrappedKey) {
    return { success: false, error: 'No legacy PIN vault to migrate' }
  }

  try {
    const salt = new Uint8Array(auth.pinSalt)
    const iterations = auth.pinKdfIterations || LEGACY_PBKDF2_ITERATIONS
    const unwrappingKey = await deriveKeyFromSecret(pin, salt, iterations)
    const masterKey = await unwrapMasterKey(auth.pinWrappedKey, unwrappingKey)

    await purgeLegacyPin()
    await migrateLegacyMasterKey()

    clearAttempts('pin')
    const requiresAuthSetup = !auth.passwordWrappedKey && !auth.fingerprintWrappedKey
    return { success: true, masterKey, requiresAuthSetup }
  } catch (error) {
    recordFailedAttempt('pin')
    return { success: false, error: 'Invalid PIN' }
  }
}

async function removeFingerprint() {
  const auth = await getAuth()
  if (!auth) return { success: false, error: 'No auth configured' }

  if (!auth.passwordWrappedKey) {
    return { success: false, error: 'Cannot remove fingerprint without password backup' }
  }

  delete auth.fingerprintEnabled
  delete auth.fingerprintWrappedKey
  delete auth.fingerprintCredentialId
  delete auth.fingerprintPrfSalt
  delete auth.fingerprintSalt
  await setAuth(auth)

  return { success: true }
}

async function removePassword() {
  const auth = await getAuth()
  if (!auth) return { success: false, error: 'No auth configured' }

  if (!auth.fingerprintEnabled) {
    return { success: false, error: 'Cannot remove password without fingerprint backup' }
  }

  delete auth.passwordWrappedKey
  delete auth.passwordSalt
  delete auth.passwordKdfIterations
  delete auth.passwordHash
  await setAuth(auth)

  return { success: true }
}
return {
  initAuth,
  startFingerprintEnrollment,
  enrollFingerprint,
  authenticateFingerprint,
  startPasswordCreation,
  setPassword,
  authenticatePassword,
  authenticateLegacyPIN,
  removeFingerprint,
  removePassword,
  checkRateLimit,
  checkCreationTimer
}
})();

const pairingModule = (function() {
const { getPasswordVault, setPasswordVault, getAuth, setAuth } = storeModule
const { createBackupSignature, verifyBackupSignature } = cryptoModule
const PAIRING_TIMEOUT = 60000

function generatePairingCode() {
  const range = 9000
  const limit = Math.floor(0x100000000 / range) * range
  const array = new Uint32Array(1)
  do {
    crypto.getRandomValues(array)
  } while (array[0] >= limit)
  return String(1000 + (array[0] % range))
}

function generateSessionId() {
  return crypto.randomUUID()
}

async function generateKeyPair() {
  const keyPair = await crypto.subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' },
    true,
    ['deriveKey', 'deriveBits']
  )

  const publicKeyRaw = await crypto.subtle.exportKey('raw', keyPair.publicKey)

  return {
    privateKey: keyPair.privateKey,
    publicKey: Array.from(new Uint8Array(publicKeyRaw))
  }
}

async function deriveSharedKey(privateKey, publicKeyRaw) {
  const publicKey = await crypto.subtle.importKey(
    'raw',
    new Uint8Array(publicKeyRaw),
    { name: 'ECDH', namedCurve: 'P-256' },
    false,
    []
  )

  return crypto.subtle.deriveKey(
    { name: 'ECDH', public: publicKey },
    privateKey,
    { name: 'AES-GCM', length: 256 },
    true,
    ['encrypt', 'decrypt', 'wrapKey', 'unwrapKey']
  )
}

async function derivePinFromSharedKey(sharedKey) {
  const keyBytes = await crypto.subtle.exportKey('raw', sharedKey)
  const view = new DataView(keyBytes)
  const num = view.getUint32(0, true)
  return String(num % 10000).padStart(4, '0')
}

async function initiatePairing() {
  const keyPair = await generateKeyPair()
  const sessionId = generateSessionId()

  const qrData = JSON.stringify({
    type: 'valid-vault-pair',
    sessionId,
    publicKey: keyPair.publicKey
  })

  return {
    qrData,
    sessionId,
    privateKey: keyPair.privateKey,
    expiresAt: Date.now() + PAIRING_TIMEOUT
  }
}

async function respondToPairing(sourcePublicKey) {
  const keyPair = await generateKeyPair()
  const sharedKey = await deriveSharedKey(keyPair.privateKey, sourcePublicKey)
  const pin = await derivePinFromSharedKey(sharedKey)

  const responseData = JSON.stringify({
    type: 'valid-vault-pair-response',
    publicKey: keyPair.publicKey
  })

  return {
    responseData,
    sharedKey,
    pin
  }
}

async function completePairing(privateKey, targetPublicKey) {
  const sharedKey = await deriveSharedKey(privateKey, targetPublicKey)
  const pin = await derivePinFromSharedKey(sharedKey)

  return {
    sharedKey,
    pin
  }
}

async function requestPairing() {
  const code = generatePairingCode()
  const sessionId = generateSessionId()
  const keyPair = await generateKeyPair()

  return {
    code,
    sessionId,
    privateKey: keyPair.privateKey,
    publicKey: keyPair.publicKey,
    expiresAt: Date.now() + PAIRING_TIMEOUT
  }
}

function parseQR(qrData) {
  try {
    const data = JSON.parse(qrData)
    if (data.type !== 'valid-vault-pair') {
      return { success: false, error: 'Invalid QR code' }
    }
    return { success: true, sessionId: data.sessionId, publicKey: data.publicKey }
  } catch (error) {
    return { success: false, error: 'Invalid QR format' }
  }
}

function parseResponse(responseData) {
  try {
    const data = JSON.parse(responseData)
    if (data.type !== 'valid-vault-pair-response') {
      return { success: false, error: 'Invalid response' }
    }
    return { success: true, publicKey: data.publicKey }
  } catch (error) {
    return { success: false, error: 'Invalid response format' }
  }
}

async function wrapMasterKeyForTransfer(masterKey, sharedKey) {
  const iv = crypto.getRandomValues(new Uint8Array(12))

  let keyToWrap = masterKey
  if (!(masterKey instanceof CryptoKey)) {
    keyToWrap = await crypto.subtle.importKey(
      'raw',
      new Uint8Array(masterKey),
      { name: 'AES-GCM', length: 256 },
      true,
      ['encrypt', 'decrypt']
    )
  }

  const wrapped = await crypto.subtle.wrapKey(
    'raw',
    keyToWrap,
    sharedKey,
    { name: 'AES-GCM', iv }
  )

  return {
    wrapped: Array.from(new Uint8Array(wrapped)),
    iv: Array.from(iv)
  }
}

async function unwrapMasterKeyFromTransfer(wrappedData, sharedKey) {
  const masterKey = await crypto.subtle.unwrapKey(
    'raw',
    new Uint8Array(wrappedData.wrapped),
    sharedKey,
    { name: 'AES-GCM', iv: new Uint8Array(wrappedData.iv) },
    { name: 'AES-GCM', length: 256 },
    true,
    ['encrypt', 'decrypt']
  )

  return masterKey
}

async function prepareTransfer(masterKey, sharedKey) {
  if (!masterKey) {
    return { success: false, error: 'Unlock vault first to transfer' }
  }

  if (!sharedKey) {
    return { success: false, error: 'Complete pairing first' }
  }

  const vault = await getPasswordVault()

  if (!vault) {
    return { success: false, error: 'No vault to transfer' }
  }

  const passwordCount = Object.values(vault.credentials || {}).flat().length

  const wrappedMasterKey = await wrapMasterKeyForTransfer(masterKey, sharedKey)

  const payloadObj = {
    version: 2,
    createdAt: Date.now(),
    passwordCount,
    vault: vault,
    wrappedMasterKey: wrappedMasterKey
  }

  const payload = JSON.stringify(payloadObj)

  let signingKey = masterKey
  if (!(masterKey instanceof CryptoKey)) {
    signingKey = await crypto.subtle.importKey(
      'raw',
      new Uint8Array(masterKey),
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    )
  }

  const signature = await createBackupSignature(payload, signingKey)

  return {
    success: true,
    data: {
      payload,
      signature
    },
    meta: {
      passwordCount,
      createdAt: Date.now()
    }
  }
}

async function encryptTransfer(transferData, sharedKey) {
  const encoder = new TextEncoder()
  const iv = crypto.getRandomValues(new Uint8Array(12))

  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    sharedKey,
    encoder.encode(JSON.stringify(transferData))
  )

  return {
    iv: Array.from(iv),
    ciphertext: Array.from(new Uint8Array(ciphertext))
  }
}

async function decryptTransfer(encrypted, sharedKey) {
  const decoder = new TextDecoder()

  const plaintext = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: new Uint8Array(encrypted.iv) },
    sharedKey,
    new Uint8Array(encrypted.ciphertext)
  )

  return JSON.parse(decoder.decode(plaintext))
}

async function verifyTransfer(transferData, masterKey) {
  let verifyKey = masterKey
  if (!(masterKey instanceof CryptoKey)) {
    verifyKey = await crypto.subtle.importKey(
      'raw',
      new Uint8Array(masterKey),
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    )
  }

  const valid = await verifyBackupSignature(transferData.payload, transferData.signature, verifyKey)

  if (!valid) {
    return { valid: false, error: 'Backup corrupted or tampered' }
  }

  const meta = JSON.parse(transferData.payload)
  return {
    valid: true,
    createdAt: meta.createdAt,
    passwordCount: meta.passwordCount
  }
}

async function receiveTransfer(transferData, sharedKey, localMasterKey) {
  if (!sharedKey) {
    return { success: false, error: 'Pairing key required' }
  }

  const data = JSON.parse(transferData.payload)

  if (data.version !== 2 || !data.wrappedMasterKey) {
    return { success: false, error: 'Incompatible transfer format' }
  }

  const masterKey = await unwrapMasterKeyFromTransfer(data.wrappedMasterKey, sharedKey)

  const verification = await verifyTransfer(transferData, masterKey)
  if (!verification.valid) {
    return { success: false, error: verification.error }
  }

  const incomingVault = data.vault
  const localVault = await getPasswordVault()

  if (!localVault) {
    incomingVault.meta.lastAccess = Date.now()
    await setPasswordVault(incomingVault)
    return {
      success: true,
      masterKey,
      sharedKey: masterKey,
      imported: { passwordCount: verification.passwordCount },
      requiresAuthSetup: true
    }
  }

  const localCreatedAt = localVault.meta.createdAt
  const incomingCreatedAt = incomingVault.meta.createdAt

  let sharedMasterKey
  let localForMerge
  let incomingForMerge

  if (incomingCreatedAt <= localCreatedAt) {
    sharedMasterKey = masterKey
    localForMerge = await reEncryptVault(localVault, localMasterKey, sharedMasterKey)
    incomingForMerge = incomingVault
  } else {
    sharedMasterKey = localMasterKey
    localForMerge = localVault
    incomingForMerge = await reEncryptVault(incomingVault, masterKey, sharedMasterKey)
  }

  const merged = await mergeVaults(localForMerge, incomingForMerge, sharedMasterKey)
  merged.meta.createdAt = Math.min(localCreatedAt, incomingCreatedAt)
  merged.meta.lastAccess = Date.now()
  await setPasswordVault(merged)

  const mergedCount = Object.values(merged.credentials || {}).flat().filter(function (c) { return !c.deleted }).length

  return {
    success: true,
    masterKey: sharedMasterKey,
    sharedMasterKey: sharedMasterKey,
    imported: { passwordCount: mergedCount },
    requiresAuthSetup: true
  }
}

function isExpired(expiresAt) {
  return Date.now() > expiresAt
}
return {
  generatePairingCode,
  generateSessionId,
  initiatePairing,
  respondToPairing,
  completePairing,
  requestPairing,
  parseQR,
  parseResponse,
  prepareTransfer,
  encryptTransfer,
  decryptTransfer,
  verifyTransfer,
  receiveTransfer,
  deriveSharedKey,
  derivePinFromSharedKey,
  isExpired
}
})();

const vault = {
  crypto: cryptoModule,
  store: storeModule,
  session: sessionModule,
  passwords: passwordsModule,
  auth: authModule,
  pairing: pairingModule
}
const pairing = pairingModule

window.vault = vault
window.pairing = pairing

window.onerror = function(msg, url, line) {
  console.error('Error:', msg, 'at line', line)
  var log = document.getElementById('log')
  if (log) log.innerHTML = '<div class="log-entry error">JS Error: ' + msg + ' (line ' + line + ')</div>' + log.innerHTML
}

document.addEventListener('DOMContentLoaded', function() {
  log('Local Vault loaded')
  updateStatus()
})

function log(msg, type) {
  var el = document.getElementById('log')
  if (!el) return
  var entry = document.createElement('div')
  entry.className = 'log-entry' + (type ? ' ' + type : '')
  entry.textContent = new Date().toLocaleTimeString() + ' - ' + msg
  el.insertBefore(entry, el.firstChild)
}

async function updateStatus() {
  try {
    var status = await vault.auth.initAuth()
    var state = vault.session.getState()
    document.getElementById('status-fingerprint').className = 'status ' + (status.hasFingerprint ? 'active' : 'inactive')
    document.getElementById('status-pin').className = 'status ' + (state.hasSessionPin ? 'active' : 'inactive')
    document.getElementById('status-password').className = 'status ' + (status.hasPassword ? 'active' : 'inactive')
    document.getElementById('status-session').className = 'status ' + (state.hasMasterKey ? 'active' : 'inactive')
    log('Status updated')
  } catch (e) {
    log('Status error: ' + e.message, 'error')
  }
}

function showModal(html) {
  var container = document.getElementById('modal-container')
  container.innerHTML = '<div class="modal"><div class="modal-content">' + html + '</div></div>'
  container.classList.remove('hidden')
}

function hideModal() {
  document.getElementById('modal-container').classList.add('hidden')
}

window.showEnrollFingerprint = async function() {
  vault.auth.startFingerprintEnrollment()
  log('Starting fingerprint enrollment...')
  var masterKey = vault.session.getMasterKey()
  var result = await vault.auth.enrollFingerprint(masterKey)
  if (result.success) {
    log('Fingerprint enrolled', 'success')
    vault.session.setMasterKey(result.masterKey)
  } else {
    log('Enrollment failed: ' + result.error, 'error')
  }
  updateStatus()
}

window.authFingerprint = async function() {
  log('Logging in with fingerprint...')
  var result = await vault.auth.authenticateFingerprint()
  if (result.success) {
    log('Fingerprint auth success', 'success')
    vault.session.setMasterKey(result.masterKey)
    if (result.requiresReenroll) {
      log('Legacy fingerprint wrap migrated and removed. Enroll fingerprint again now.', 'error')
    }
  } else {
    log('Login failed: ' + result.error, 'error')
  }
  updateStatus()
}

window.showSetPIN = function() {
  if (!vault.session.hasMasterKey()) {
    log('Unlock vault first to set a session PIN', 'error')
    return
  }
  showModal('<h3>Set Session PIN</h3><p style="color:#666;font-size:13px;">Quick unlock for this session only. Clears when the app closes.</p><input type="text" id="modal-pin" placeholder="4-6 digits" maxlength="6"><div style="margin-top:16px;"><button onclick="confirmSetPIN()">Set PIN</button><button onclick="hideModal()" class="secondary">Cancel</button></div>')
}

window.confirmSetPIN = async function() {
  var pin = document.getElementById('modal-pin').value
  var result = await vault.session.setSessionPin(pin)
  if (result.success) {
    log('Session PIN set. Clears when the app closes.', 'success')
  } else {
    log('Set PIN failed: ' + result.error, 'error')
  }
  hideModal()
  updateStatus()
}

window.authPIN = async function() {
  var pin = document.getElementById('pin-input').value
  if (vault.session.isSoftLocked()) {
    var result = await vault.session.resumeWithPin(pin)
    if (result.success) {
      log('Session resumed', 'success')
    } else {
      log(result.error, 'error')
    }
  } else {
    var status = await vault.auth.initAuth()
    if (status.hasLegacyPIN) {
      var result = await vault.auth.authenticateLegacyPIN(pin)
      if (result.success) {
        vault.session.setMasterKey(result.masterKey)
        log('Legacy PIN vault migrated. PIN is now session-only.', 'success')
        if (result.requiresAuthSetup) {
          log('Set a password or fingerprint now. PIN can no longer open the vault after restart.', 'error')
        }
      } else {
        log(result.error, 'error')
      }
    } else {
      log(vault.session.hasMasterKey() ? 'Already unlocked this session.' : 'No session PIN set. Unlock with password or fingerprint first.', 'error')
    }
  }
  updateStatus()
}

window.showSetPassword = function() {
  vault.auth.startPasswordCreation()
  showModal('<h3>Set Password</h3><input type="password" id="modal-password" placeholder="8+ characters"><div style="margin-top:16px;"><button onclick="confirmSetPassword()">Set Password</button><button onclick="hideModal()" class="secondary">Cancel</button></div>')
}

window.confirmSetPassword = async function() {
  var password = document.getElementById('modal-password').value
  var masterKey = vault.session.getMasterKey()
  var result = await vault.auth.setPassword(password, masterKey)
  if (result.success) {
    log('Password set', 'success')
    vault.session.setMasterKey(result.masterKey)
  } else {
    log('Set password failed: ' + result.error, 'error')
  }
  hideModal()
  updateStatus()
}

window.authPassword = async function() {
  var password = document.getElementById('password-input').value
  var result = await vault.auth.authenticatePassword(password)
  if (result.success) {
    log('Password auth success', 'success')
    vault.session.setMasterKey(result.masterKey)
  } else {
    log('Login failed: ' + result.error, 'error')
  }
  updateStatus()
}

window.showSaveCredential = function() {
  if (!vault.session.hasMasterKey()) { log('Login required', 'error'); return }
  var domain = document.getElementById('domain-input').value || 'example.com'
  showModal('<h3>Add Credential</h3><input type="text" id="modal-domain" value="' + domain + '" placeholder="domain"><input type="text" id="modal-login" placeholder="username"><input type="password" id="modal-password-cred" placeholder="password"><div style="margin-top:16px;"><button onclick="saveCredential()">Save</button><button onclick="hideModal()" class="secondary">Cancel</button></div>')
}

window.saveCredential = async function() {
  var masterKey = vault.session.getMasterKey()
  if (!masterKey) { log('Not authenticated', 'error'); hideModal(); return }
  var domain = document.getElementById('modal-domain').value
  var login = document.getElementById('modal-login').value
  var password = document.getElementById('modal-password-cred').value
  var result = await vault.passwords.saveCredential(domain, login, password, masterKey)
  if (result.success) {
    log('Credential saved for ' + domain, 'success')
    loadCredentials()
  } else {
    log('Save failed: ' + result.error, 'error')
  }
  hideModal()
}

window.loadCredentials = async function() {
  var masterKey = vault.session.getMasterKey()
  var domain = document.getElementById('domain-input').value
  var listEl = document.getElementById('credentials-list')
  if (!masterKey) { listEl.innerHTML = '<p style="color:#666;">Login required</p>'; return }
  if (!domain) { listEl.innerHTML = '<p style="color:#666;">Enter domain</p>'; return }
  var result = await vault.passwords.getCredentials(domain, masterKey)
  if (!result.success) { listEl.innerHTML = '<p style="color:#e74c3c;">' + result.error + '</p>'; return }
  if (result.credentials.length === 0) { listEl.innerHTML = '<p style="color:#666;">No credentials</p>'; return }
  listEl.innerHTML = result.credentials.map(function(c) {
    return '<div class="credential-row"><span class="credential-login">' + c.username + '</span><span class="credential-pass">••••••••</span></div>'
  }).join('')
}

window.lockAll = function() {
  if (vault.session.hasSessionPin()) {
    vault.session.softLockNow()
    log('Locked. Resume with your session PIN.', 'success')
  } else {
    vault.session.lockAll()
    log('Session locked', 'success')
  }
  updateStatus()
}

window.clearAll = function() {
  showModal('<h3>Clear All Data</h3><p style="color:#666;font-size:13px;">Deletes the vault, every credential, and all login methods on this device. This cannot be undone.</p><div style="margin-top:16px;"><button onclick="confirmClearAll()" class="danger">Nuke It</button><button onclick="hideModal()" class="secondary">Cancel</button></div>')
}

window.confirmClearAll = async function() {
  await vault.store.clearAll()
  vault.session.lockAll()
  hideModal()
  log('All data cleared', 'success')
  updateStatus()
}

window.startSecureSync = function() {
  log('Sync not implemented yet')
}
</script>
